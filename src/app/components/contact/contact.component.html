<h2>Contact App</h2>

<!-- Add Contact -->
<mat-form-field>
  <input matInput placeholder="Name" [(ngModel)]="newContact.name">
</mat-form-field>

<mat-form-field>
  <input matInput placeholder="Email" [(ngModel)]="newContact.email">
</mat-form-field>

<mat-form-field>
  <input matInput placeholder="Phone" [(ngModel)]="newContact.phone">
</mat-form-field>

<button mat-raised-button color="primary" (click)="addContact()" style="margin-left: 10px;">
  Add Contact
</button>

<!-- Search -->
 <div>
<mat-form-field>
  <input matInput placeholder="Search by name or email" [(ngModel)]="searchTerm" (input)="search()">
</mat-form-field>
</div>
<!-- Table -->
<table mat-table [dataSource]="filteredContacts">

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let contact">{{contact.name}}</td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let contact">{{contact.email}}</td>
  </ng-container>

  <ng-container matColumnDef="phone">
    <th mat-header-cell *matHeaderCellDef>Phone</th>
    <td mat-cell *matCellDef="let contact">{{contact.phone}}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let contact">
        <button mat-button color="primary" (click)="editContact(contact)">
  Edit
</button>
      <button mat-button color="warn" (click)="deleteContact(contact.id)">
        Delete
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="['name','email','phone','actions']"></tr>
  <tr mat-row *matRowDef="let row; columns: ['name','email','phone','actions'];"></tr>

</table>
